version: '3.8'

services:
  im2svg:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: im2svg_prod
    ports:
      - "127.0.0.1:8000:8000"  # Only expose to localhost
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - PYTHONUNBUFFERED=1
      - WORKERS=4
    command: gunicorn app:app -w 4 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --timeout 300
    restart: always
    networks:
      - im2svg_network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  nginx:
    image: nginx:alpine
    container_name: im2svg_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - im2svg
    restart: always
    networks:
      - im2svg_network

networks:
  im2svg_network:
    driver: bridge
