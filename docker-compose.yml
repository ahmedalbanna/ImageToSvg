version: '3.8'

services:
  im2svg:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: im2svg
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - PYTHONUNBUFFERED=1
    volumes:
      # Mount application code for development (comment out for production)
      - ./app.py:/app/app.py
      - ./im2svg.py:/app/im2svg.py
      - ./static:/app/static
      - ./templates:/app/templates
      # Persist cache (optional)
      - im2svg_cache:/tmp/im2svg
    restart: unless-stopped
    networks:
      - im2svg_network
    labels:
      - "com.im2svg.description=Image to SVG Converter"
      - "com.im2svg.version=1.0"

  # Optional: Nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    container_name: im2svg_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - im2svg
    restart: unless-stopped
    networks:
      - im2svg_network
    profiles:
      - production

volumes:
  im2svg_cache:
    driver: local

networks:
  im2svg_network:
    driver: bridge
